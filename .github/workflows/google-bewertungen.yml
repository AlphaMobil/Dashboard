name: Google-Bewertungen aktualisieren

on:
  workflow_dispatch:          # „Run workflow“-Knopf auf GitHub
  schedule:
    - cron: '43 5 * * *'      # täglich ca. 6:43 / 7:43 Uhr deutscher Zeit

permissions:
  contents: write

concurrency:
  group: google-bewertungen
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: Bewertungen über die Google-Business-Profile-API holen
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_LOCATIONS: ${{ secrets.GBP_LOCATIONS }}
          HC_PASSWORT: ${{ secrets.HC_PASSWORT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$GBP_REFRESH_TOKEN" ] || [ -z "$GBP_LOCATIONS" ]; then
            echo "Google-Zugang ist noch nicht eingerichtet (Secrets fehlen) – siehe README."; exit 0
          fi
          python3 tools/google_reviews.py
      - name: Veröffentlichen
        run: |
          git config user.name "Alpha-Mobil Händler-Cockpit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google.enc.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -q -m "Google-Bewertungen aktualisiert"
          for i in 1 2; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
