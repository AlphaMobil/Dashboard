<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Händler-Cockpit · Alpha-Mobil</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#004177">
<meta name="application-name" content="Händler-Cockpit">
<meta name="apple-mobile-web-app-title" content="Händler-Cockpit">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--color-bg:#ffffff;--color-fg:#16181d;--color-fg-muted:#6b7080;--font-anthropic-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--cds-dur-slow:.45s;--cds-ease-out:cubic-bezier(.2,.8,.2,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--color-bg:#16181d;--color-fg:#eef0f4;--color-fg-muted:#9aa1b0;color-scheme:dark}}
html,body{margin:0;background:color-mix(in srgb,var(--color-fg) 5%,var(--color-bg));font-family:var(--font-anthropic-sans);color:var(--color-fg)}
#dash-root{max-width:1440px;margin:0 auto;padding:clamp(8px,2vw,24px)}
.gate{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:24px 16px;background:color-mix(in srgb,var(--color-fg) 5%,var(--color-bg))}
.gate[hidden]{display:none}
.gcard{width:100%;max-width:380px;background:var(--color-bg);border-radius:24px;padding:28px 24px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 40px -24px rgba(16,24,40,.25)}
.gmark{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#1F6FB2,#004177);display:grid;place-items:center;font:700 18px/1 var(--font-anthropic-sans);color:#fff}
.gcard small{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--color-fg-muted);margin-top:6px}
.gcard h1{margin:0;font-size:22px;font-weight:600}
.gcard p{margin:0 0 6px;color:var(--color-fg-muted);font-size:13.5px}
.gcard label{font-size:12.5px;font-weight:600}
.gcard input[type=password]{font:inherit;font-size:16px;color:var(--color-fg);background:color-mix(in srgb,var(--color-fg) 5%,var(--color-bg));border:1px solid color-mix(in srgb,var(--color-fg) 12%,transparent);border-radius:12px;padding:12px;min-height:46px}
.gkeep{display:flex;align-items:center;gap:8px;font-weight:500!important;color:var(--color-fg-muted)}
.gkeep input{width:18px;height:18px;accent-color:#004177}
.gcard button{font:600 15px/1 var(--font-anthropic-sans);color:#fff;background:#004177;border:0;border-radius:999px;padding:14px;cursor:pointer;min-height:46px;margin-top:4px}
.gcard button:disabled{opacity:.6}
.gerr{color:#E5484D!important;font-weight:600;margin:0!important}
.hc-foot{max-width:1440px;margin:0 auto;padding:0 clamp(8px,2vw,24px) 24px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--color-fg-muted)}
.hc-foot button{all:unset;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="gcard" id="gform" autocomplete="on">
    <div class="gmark" aria-hidden="true">A</div>
    <small>Alpha-Mobil · intern</small>
    <h1>Händler-Cockpit</h1>
    <p>Bitte gib das Team-Passwort ein.</p>
    <input type="text" name="username" value="Händler-Cockpit" autocomplete="username" hidden>
    <label for="gpw">Passwort</label>
    <input type="password" id="gpw" autocomplete="current-password" required>
    <label class="gkeep" for="gkeep"><input type="checkbox" id="gkeep" checked> Auf diesem Gerät angemeldet bleiben</label>
    <button type="submit" id="gbtn">Öffnen</button>
    <p class="gerr" id="gerr" role="alert" hidden></p>
  </form>
</div>
<div id="dash-root"></div>
<div class="hc-foot" id="foot" hidden><span id="stand"></span><button type="button" id="logout">Abmelden</button></div>

<template id="page">
<style>
#dash-root{--dash-gutter:0}
.vx{--vx-canvas:color-mix(in srgb,var(--color-fg) 5%,var(--color-bg));--vx-card:var(--color-bg);--vx-soft:color-mix(in srgb,var(--color-fg) 4%,var(--color-bg));--vx-line:color-mix(in srgb,var(--color-fg) 9%,transparent);--vx-ink:var(--color-fg);--vx-mute:var(--color-fg-muted);--vx-or:#004177;--vx-or2:#1F6FB2;--vx-navy:#00223E;--vx-amber:#C2760F;--vx-gold:#E5A400;--vx-green:#1E9E5A;--vx-red:#E5484D;
  font-family:var(--font-anthropic-sans);color:var(--vx-ink);background:var(--vx-canvas);border-radius:28px;padding:clamp(14px,2.4vw,28px)}
.vx *{box-sizing:border-box}
.vx .top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:clamp(18px,3vw,30px)}
.vx .brand{display:flex;align-items:center;gap:10px;background:var(--vx-card);border-radius:999px;padding:6px 16px 6px 6px;font-weight:600;font-size:15px}
.vx .logo{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,var(--vx-or2),var(--vx-or));color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.vx .nav{display:flex;flex-wrap:wrap;gap:2px;background:var(--vx-card);border-radius:999px;padding:5px}
.vx .tab{border:0;background:none;font:inherit;font-size:14px;color:var(--vx-ink);padding:8px 16px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.vx .tab:hover{background:var(--vx-soft)}
.vx .tab[aria-selected=true]{background:var(--vx-ink);color:var(--vx-card)}
.vx .stamp{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--vx-card);border-radius:999px;padding:6px 14px 6px 6px;font-size:13px}
.vx .stamp .dot{width:34px;height:34px;border-radius:50%;background:var(--vx-soft);display:grid;place-items:center;font-size:15px}
.vx .stamp small{display:block;color:var(--vx-mute);font-size:11px}
.vx h1{font-size:clamp(26px,3.6vw,40px);font-weight:500;letter-spacing:-.02em;margin:0 0 6px}
.vx .sub{color:var(--vx-mute);font-size:14px;margin:0 0 clamp(18px,3vw,28px)}
.vx .card{background:var(--vx-card);border-radius:22px;padding:20px;min-width:0}
.vx .card h2{font-size:16px;font-weight:500;margin:0}
.vx .card .note{color:var(--vx-mute);font-size:12px;margin:4px 0 14px}
.vx .row{display:grid;gap:16px;margin-bottom:16px}
.vx .r1{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.vx .r2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media (max-width:860px){.vx .r2{grid-template-columns:minmax(0,1fr)}}
.vx .big{font-size:clamp(28px,3.4vw,38px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:6px 0 8px;min-height:1.2em}
.vx .pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--vx-green) 14%,transparent);color:var(--vx-green);font-weight:500;white-space:nowrap}
.vx .pill.red{background:color-mix(in srgb,var(--vx-red) 14%,transparent);color:var(--vx-red)}
.vx .pill.gray{background:var(--vx-soft);color:var(--vx-mute)}
.vx .pillrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--vx-mute);flex-wrap:wrap}
.vx .btns{display:flex;gap:10px;margin:16px 0}
.vx .btn{flex:1;text-align:center;border-radius:999px;padding:11px 14px;font-size:14px;font-weight:500;border:0;font-family:inherit;cursor:pointer}
.vx .btn.dark{background:var(--vx-ink);color:var(--vx-card)}
.vx .btn.light{background:var(--vx-soft);color:var(--vx-ink)}
.vx .wallets{background:var(--vx-soft);border-radius:16px;padding:12px}
.vx .wallets .hd{font-size:12px;color:var(--vx-mute);margin-bottom:10px}
.vx .wallets .hd b{color:var(--vx-ink);font-weight:500}
.vx .wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vx .w{background:var(--vx-card);border-radius:12px;padding:10px}
.vx .w .n{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.vx .w .n i{width:8px;height:8px;border-radius:50%;display:inline-block}
.vx .w .v{font-size:15px;font-weight:600;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.vx .w .s{font-size:11px;color:var(--vx-mute)}
.vx .w .st{font-size:11px;margin-top:6px;color:var(--vx-green);font-weight:500}
.vx .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--vx-card);border-radius:22px;padding:12px}
.vx .stat{background:var(--vx-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:130px;transition:transform .25s}
.vx .stat:hover{transform:translateY(-3px)}
.vx .stat .lab{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--vx-mute)}
.vx .stat .ic{width:26px;height:26px;border-radius:50%;background:var(--vx-card);display:grid;place-items:center;font-size:12px}
.vx .stat.hot{background:linear-gradient(150deg,var(--vx-or2),var(--vx-or));color:#fff}
.vx .stat.hot .lab,.vx .stat.hot .pillrow{color:rgba(255,255,255,.85)}
.vx .stat.hot .ic{background:rgba(255,255,255,.22);color:#fff}
.vx .stat.hot .pill{background:rgba(255,255,255,.22);color:#fff}
.vx .stat .big{font-size:clamp(24px,2.6vw,30px);margin:8px 0}
.vx .chart{position:relative;min-height:230px}
.vx .legend{display:flex;gap:12px;font-size:12px;color:var(--vx-mute)}
.vx .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.vx .cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.vx .inner{background:var(--vx-soft);border-radius:16px;padding:14px}
.vx .bar{position:relative;height:14px;border-radius:999px;overflow:hidden;margin:12px 0 8px;background:repeating-linear-gradient(-45deg,var(--vx-line) 0 4px,transparent 4px 8px)}
.vx .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--vx-or);transition:width .8s}
.vx .barlab{display:flex;justify-content:space-between;font-size:12px;color:var(--vx-mute);font-variant-numeric:tabular-nums}
.vx .barlab b{color:var(--vx-ink);font-weight:600}
.vx .mini{display:grid;gap:10px;margin-top:16px}
.vx .mini div{display:flex;justify-content:space-between;font-size:13px;padding:10px 12px;background:var(--vx-soft);border-radius:12px}
.vx .mini span{color:var(--vx-mute)}
.vx .mini b{font-variant-numeric:tabular-nums;font-weight:600}
.vx .tools{display:flex;gap:8px;flex-wrap:wrap}
.vx .search,.vx select{font:inherit;font-size:13px;border:1px solid var(--vx-line);background:var(--vx-card);color:var(--vx-ink);border-radius:999px;padding:8px 14px}
.vx .search{width:min(100%,220px)}
.vx .tbox{max-height:30rem;overflow:auto;margin-top:12px;border-radius:14px}
.vx table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.vx th{position:sticky;top:0;background:var(--vx-soft);color:var(--vx-mute);font-weight:500;text-align:left;padding:10px 12px;white-space:nowrap;z-index:1}
.vx th:first-child{border-radius:12px 0 0 12px}.vx th:last-child{border-radius:0 12px 12px 0}
.vx th button{all:unset;cursor:pointer}
.vx td{padding:11px 12px;border-bottom:1px solid var(--vx-line);vertical-align:top}
.vx tr:hover td{background:color-mix(in srgb,var(--vx-or) 4%,transparent)}
.vx td.r,.vx th.r{text-align:right}
.vx .muted{color:var(--vx-mute)}
.vx .stat-dot{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.vx .stat-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.vx .c-bad{color:var(--vx-red)}.vx .c-warn{color:var(--vx-amber)}.vx .c-ok{color:var(--vx-green)}
.vx a{color:inherit;text-decoration:none;border-bottom:1px solid var(--vx-line)}
.vx a:hover{color:var(--vx-or)}
.vx .soon{border:1.5px dashed var(--vx-line);border-radius:22px;padding:20px;color:var(--vx-mute);font-size:13px}
.vx .tip{position:absolute;pointer-events:none;background:var(--vx-ink);color:var(--vx-card);border-radius:10px;padding:6px 10px;font-size:12px;white-space:nowrap;z-index:3}
.vx .tip div:first-child{opacity:.7}
@media (prefers-reduced-motion:no-preference){.vx section:not([hidden]) .card,.vx section:not([hidden]) .stats{animation:vxin var(--cds-dur-slow) var(--cds-ease-out) both}}
@keyframes vxin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vx .feed{display:grid;gap:10px}
.vx .rv{background:var(--vx-soft);border-radius:16px;padding:14px 16px}
.vx .rv .h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--vx-mute)}
.vx .rv .stars{color:var(--vx-gold);letter-spacing:1px;font-size:13px}
.vx .rv .p{font-size:13px;font-weight:600;margin:6px 0 4px;color:var(--vx-ink)}
.vx .rv .t{font-size:13.5px;line-height:1.55;margin:0}
.vx .rv details{margin-top:10px;font-size:13px}
.vx .rv summary{cursor:pointer;color:var(--vx-or2);font-weight:500}
.vx .rv .ans{background:var(--vx-card);border-radius:12px;padding:10px 12px;margin-top:8px;line-height:1.55}
.vx .newb{background:var(--vx-or);color:#fff;border-radius:999px;padding:1px 8px;font-weight:600;font-size:11px}
@media (prefers-color-scheme:dark){.vx{--vx-or:#2F7FC8;--vx-or2:#5AA2E0}}
[data-dash-source-state=empty]{color:transparent}
[data-dash-source-state=refreshing]{opacity:.5;transition:opacity var(--cds-dur-slow)}
</style>

<div class="vx">
  <div class="top">
    <div class="brand"><span class="logo">A</span>Händler-Cockpit</div>
    <div class="nav" role="tablist">
      <button class="tab" role="tab" data-tab="uebersicht" aria-selected="true">Übersicht</button>
      <button class="tab" role="tab" data-tab="modelle" aria-selected="false">Modelle</button>
      <button class="tab" role="tab" data-tab="auffaellig" aria-selected="false">Auffälligkeiten</button>
      <button class="tab" role="tab" data-tab="bewertungen" aria-selected="false">Bewertungen</button>
      <button class="tab" role="tab" data-tab="produkte" aria-selected="false">Produkte</button>
    </div>
    <div class="stamp"><span class="dot">⟳</span><div>Stand 02.11.2026<small>Händler, eigener Shop und Trustpilot</small></div></div>
  </div>

  <section data-page="uebersicht">
    <h1>Alpha Motors &amp; GreenStreet im Handel</h1>
    <p class="sub">Listungen, Preise und Bewertungen bei vier Händlern auf einen Blick – <b data-draw="lead_n" data-source="kpi" data-field="flags">—</b> Auffälligkeiten, davon <b data-draw="lead_e" data-source="kpi" data-field="preisfehler">—</b> Preisfehler.</p>

    <div class="row r1">
      <div class="card">
        <div class="cardhead"><h2>Gelistete Produktseiten</h2><span class="pill gray">5 Kanäle</span></div>
        <div class="big" data-draw="k_listings" data-source="kpi" data-field="listings">—</div>
        <div class="pillrow"><span class="pill"><span data-draw="k_models" data-source="kpi" data-field="models">—</span>&nbsp;Modelle</span>über alle Shops</div>
        <div class="btns">
          <button class="btn dark" data-go="auffaellig">Auffälligkeiten prüfen</button>
          <button class="btn light" data-go="produkte">Alle Seiten</button>
        </div>
        <div class="wallets">
          <div class="hd"><b>Händler</b> | Seiten · Ø Sterne</div>
          <div class="wgrid">
            <div class="w"><div class="n"><i style="background:#0050AA"></i>Lidl</div><div class="v" data-draw="shopnum" data-source="shops" data-field="listings" data-where="shop=Lidl">—</div><div class="s"><span data-draw="shopstar" data-source="shops" data-field="stars" data-where="shop=Lidl">—</span> ★</div></div>
            <div class="w"><div class="n"><i style="background:#F2C200"></i>Netto</div><div class="v" data-draw="shopnum" data-source="shops" data-field="listings" data-where="shop=Netto">—</div><div class="s"><span data-draw="shopstar" data-source="shops" data-field="stars" data-where="shop=Netto">—</span> ★</div></div>
            <div class="w"><div class="n"><i style="background:#00843D"></i>hagebau</div><div class="v" data-draw="shopnum" data-source="shops" data-field="listings" data-where="shop=hagebau">—</div><div class="s"><span data-draw="shopstar" data-source="shops" data-field="stars" data-where="shop=hagebau">—</span> ★</div></div>
            <div class="w"><div class="n"><i style="background:#E10915"></i>Kaufland</div><div class="v" data-draw="shopnum" data-source="shops" data-field="listings" data-where="shop=Kaufland">—</div><div class="s"><span data-draw="shopstar" data-source="shops" data-field="stars" data-where="shop=Kaufland">—</span> ★</div></div>
            <div class="w"><div class="n"><i style="background:#004177"></i>alpha-mobil.com</div><div class="v" data-draw="shopnum" data-source="shops" data-field="listings" data-where="shop=alpha-mobil.com">—</div><div class="s"><span data-draw="shopstar" data-source="shops" data-field="stars" data-where="shop=alpha-mobil.com">—</span> ★</div></div>
            <div class="w"><div class="n"><i style="background:#00B67A"></i>Trustpilot</div><div class="v" data-draw="tpnum" data-source="tpstats" data-field="n">—</div><div class="s"><span data-draw="tpstar" data-source="tpstats" data-field="stars">—</span> ★ · Bewertungen</div></div>
          </div>
        </div>
      </div>

      <div class="stats">
        <div class="stat hot">
          <div class="lab">Auffälligkeiten<span class="ic">!</span></div>
          <div class="big" data-draw="k_flags" data-source="kpi" data-field="flags">—</div>
          <div class="pillrow"><span class="pill"><span data-draw="k_err" data-source="kpi" data-field="preisfehler">—</span>&nbsp;Preisfehler</span></div>
        </div>
        <div class="stat">
          <div class="lab">Bewertungen<span class="ic">✎</span></div>
          <div class="big" data-draw="k_reviews" data-source="kpi" data-field="reviews">—</div>
          <div class="pillrow"><span class="pill gray">ohne Dubletten</span></div>
        </div>
        <div class="stat">
          <div class="lab">Ø Sterne<span class="ic">★</span></div>
          <div class="big" data-draw="k_stars" data-source="kpi" data-field="stars">—</div>
          <div class="pillrow"><span class="pill red"><span data-draw="k_low" data-source="kpi" data-field="lowModels">—</span>&nbsp;unter 3,5</span>Modelle</div>
        </div>
        <div class="stat">
          <div class="lab">Drittanbieter<span class="ic">⇄</span></div>
          <div class="big" data-draw="k_third" data-source="flagcount" data-field="n" data-where="art=Drittanbieter">—</div>
          <div class="pillrow"><span class="pill gray">nur Kaufland</span></div>
        </div>
      </div>

      <div class="card">
        <div class="cardhead"><div><h2>Seiten je Händler</h2><p class="note">Nach Marke gestapelt</p></div>
          <div class="legend"><span><i style="background:var(--vx-ink)"></i>Alpha Motors</span><span><i style="background:var(--vx-or)"></i>GreenStreet</span></div></div>
        <div class="inner"><div class="chart" data-draw="c_stack" data-source="shops"></div></div>
      </div>
    </div>

    <div class="row r2">
      <div class="card">
        <h2>Anteil auffälliger Seiten</h2>
        <div class="bar"><div class="fill" data-draw="flagbar" data-source="kpi"></div></div>
        <div class="barlab"><span><b data-draw="k_flagpages" data-source="kpi" data-field="flagPages">—</b> Seiten auffällig</span><span>von <b data-draw="k_listings2" data-source="kpi" data-field="listings">—</b></span></div>
        <div class="mini">
          <div><span>Über Marktpreis</span><b data-draw="fc" data-source="flagcount" data-field="n" data-where="art=Über Marktpreis">—</b></div>
          <div><span>Schwache Bewertung</span><b data-draw="fc" data-source="flagcount" data-field="n" data-where="art=Schwache Bewertung">—</b></div>
          <div><span>Preisfehler</span><b data-draw="fc" data-source="flagcount" data-field="n" data-where="art=Preisfehler">—</b></div>
          <div><span>Drittanbieter</span><b data-draw="fc" data-source="flagcount" data-field="n" data-where="art=Drittanbieter">—</b></div>
        </div>
      </div>
      <div class="card">

<script>
(function(){
  window.HC = {PRICE_ERR: 10000, LOW: 3.5, SHOPCOL: {Lidl: '#0050AA', Netto: '#F2C200', hagebau: '#00843D', Kaufland: '#E10915'}};

  dash.loader('products', {description: 'Liest die Produktliste als Tabelle; Preise und Sterne als Zahlen.', fn: (rows) => rows.map(r => ({...r, artnr: String(r.artnr), preis: r.preis == null ? null : Number(r.preis), bewertungen: Number(r.bewertungen || 0), sterne: r.sterne == null ? null : Number(r.sterne)}))});

  dash.calc('dedup', {inputs: ['products'], title: 'Bewertungen ohne Dubletten', description: 'Fasst Zeilen mit gleichem Shop, Modell, Bewertungszahl und Sternen zusammen (Kaufland zählt Bewertungen über Varianten).',
    fn: (products) => { const seen = new Set(); return products.filter(p => p.bewertungen > 0).filter(p => { const k = p.shop + '|' + p.modell + '|' + p.bewertungen + '|' + p.sterne; if (seen.has(k)) return false; seen.add(k); return true; }); }});

  dash.calc('flags', {inputs: ['products'], title: 'Auffälligkeiten', description: 'Preise über 10.000 €, Drittanbieter, Preise über 125 % des Modell-Medians und Bewertungen unter 3,5 Sternen.',
    fn: (products) => {
      const med = {};
      products.filter(p => p.preis && p.preis < 10000 && p.typ !== 'Zubehör' && p.modell).forEach(p => { (med[p.modell] = med[p.modell] || []).push(p.preis); });
      const m = {}; for (const k in med) { const a = med[k].sort((x, y) => x - y); const i = Math.floor(a.length / 2); m[k] = a.length % 2 ? a[i] : (a[i - 1] + a[i]) / 2; }
      const out = [];
      products.forEach(p => {
        const base = {shop: p.shop, artnr: p.artnr, produkt: p.produkt, preis: p.preis, url: p.url};
        if (p.preis > 10000) out.push({...base, key: p.shop + p.artnr + 'E', art: 'Preisfehler', detail: 'Preis offensichtlich falsch eingegeben'});
        if (/Drittanbieter/.test(p.bemerkung || '')) out.push({...base, key: p.shop + p.artnr + 'D', art: 'Drittanbieter', detail: (p.bemerkung.match(/Verkäufer: ([^;(]+)/) || [, ''])[1].trim()});
        if (p.preis && p.preis < 10000 && m[p.modell] && (med[p.modell] || []).length >= 3 && p.preis > m[p.modell] * 1.25 && p.typ !== 'Zubehör') out.push({...base, key: p.shop + p.artnr + 'H', art: 'Über Marktpreis', detail: '+' + Math.round((p.preis / m[p.modell] - 1) * 100) + ' % ggü. Median ' + Math.round(m[p.modell]) + ' €'});
        if (p.sterne != null && p.bewertungen > 0 && p.sterne < 3.5) out.push({...base, key: p.shop + p.artnr + 'L', art: 'Schwache Bewertung', detail: String(p.sterne).replace('.', ',') + ' Sterne aus ' + p.bewertungen + ' Bewertungen'});
      });
      return out;
    }});

  dash.calc('flagcount', {inputs: ['flags'], title: 'Auffälligkeiten nach Art', description: 'Zählt die Auffälligkeiten je Art.',
    fn: (flags) => ['Preisfehler', 'Drittanbieter', 'Über Marktpreis', 'Schwache Bewertung'].map(art => ({art, n: flags.filter(f => f.art === art).length}))});

  dash.calc('shops', {inputs: ['products', 'dedup', 'flags'], title: 'Kennzahlen je Shop', description: 'Seiten je Marke, Bewertungen ohne Dubletten, gewichtete Sterne und Auffälligkeiten je Shop.',
    fn: (products, dedup, flags) => ['Lidl', 'Netto', 'hagebau', 'Kaufland', 'alpha-mobil.com'].map(shop => {
      const ps = products.filter(p => p.shop === shop), ds = dedup.filter(p => p.shop === shop && p.sterne != null);
      const rev = ds.reduce((s, p) => s + p.bewertungen, 0);
      return {shop, listings: ps.length, alpha: ps.filter(p => p.marke === 'Alpha Motors').length, green: ps.filter(p => p.marke === 'GreenStreet').length, reviews: rev, stars: rev ? ds.reduce((s, p) => s + p.sterne * p.bewertungen, 0) / rev : null, flags: flags.filter(f => f.shop === shop).length};
    })});

  dash.calc('matrix', {inputs: ['products', 'dedup'], title: 'Modelle × Shops', description: 'Günstigster Preis je Modell und Shop (ohne Preise über 10.000 €), Bewertungen ohne Dubletten und gewichtete Sterne.',
    fn: (products, dedup) => {
      const by = {};
      products.filter(p => p.modell && p.typ !== 'Zubehör').forEach(p => { const r = by[p.modell] = by[p.modell] || {modell: p.modell, marke: p.marke, lidl: null, netto: null, hagebau: null, kaufland: null, eigen: null, listings: 0}; r.listings++; const k = p.shop === 'alpha-mobil.com' ? 'eigen' : p.shop.toLowerCase(); if (p.preis && p.preis < 10000 && (r[k] == null || p.preis < r[k])) r[k] = p.preis; });
      return Object.values(by).map(r => {
        const ps = ['lidl', 'netto', 'hagebau', 'kaufland', 'eigen'].map(k => r[k]).filter(v => v != null);
        const ds = dedup.filter(p => p.modell === r.modell && p.sterne != null); const rev = ds.reduce((s, p) => s + p.bewertungen, 0);
        return {...r, shops: products.filter(p => p.modell === r.modell).map(p => p.shop).filter((v, i, a) => a.indexOf(v) === i).length, spanne: ps.length > 1 ? Math.max(...ps) - Math.min(...ps) : null, reviews: rev, stars: rev ? ds.reduce((s, p) => s + p.sterne * p.bewertungen, 0) / rev : null};
      });
    }});

  dash.calc('rvstats', {inputs: ['reviews'], title: 'Bewertungs-Kennzahlen', description: 'Zahl der Bewertungstexte gesamt, je Stimmung, neue seit dem letzten Abruf, Datum des letzten Abrufs und abgerufene Händler.',
    fn: (reviews) => [{total: reviews.length, positiv: reviews.filter(r => r.stimmung === 'positiv').length, neutral: reviews.filter(r => r.stimmung === 'neutral').length, negativ: reviews.filter(r => r.stimmung === 'negativ').length, neu: reviews.filter(r => r.neu === true).length, stand: reviews.map(r => r.erfasst).sort().slice(-1)[0] || null, shops: [...new Set(reviews.map(r => r.shop))].join(', ')}]});

  dash.calc('tpstats', {inputs: ['reviews'], title: 'Trustpilot', description: 'Anzahl der erfassten Trustpilot-Bewertungen und Durchschnitt der Sterne.',
    fn: (reviews) => { const t = reviews.filter(r => r.shop === 'Trustpilot'); return [{n: t.length, stars: t.length ? t.reduce((s, r) => s + r.sterne, 0) / t.length : null}]; }});

  dash.calc('themen', {inputs: ['reviews'], title: 'Bewertungen je Thema', description: 'Zählt Bewertungstexte je Thema und Stimmung.',
    fn: (reviews) => { const by = {}; reviews.forEach(r => { const t = r.thema || 'Sonstiges'; const o = by[t] = by[t] || {thema: t, positiv: 0, neutral: 0, negativ: 0, total: 0}; o[r.stimmung] = (o[r.stimmung] || 0) + 1; o.total++; }); return Object.values(by).sort((a, b) => (b.negativ - a.negativ) || (b.total - a.total)); }});

  dash.calc('kpi', {inputs: ['products', 'dedup', 'flags', 'matrix'], title: 'Kennzahlen gesamt', description: 'Seiten, Modelle, Bewertungen ohne Dubletten, gewichtete Sterne, Auffälligkeiten, betroffene Seiten und Modelle unter 3,5 Sternen.',
    fn: (products, dedup, flags, matrix) => { const ds = dedup.filter(p => p.sterne != null); const rev = ds.reduce((s, p) => s + p.bewertungen, 0);
      return [{listings: products.length, models: matrix.length, reviews: rev, stars: rev ? ds.reduce((s, p) => s + p.sterne * p.bewertungen, 0) / rev : null, flags: flags.length, preisfehler: flags.filter(f => f.art === 'Preisfehler').length, flagPages: new Set(flags.map(f => f.shop + f.artnr)).size, lowModels: matrix.filter(m => m.stars != null && m.stars < 3.5).length}]; }});
})();
</script>

<script>
(function(){
  const show = (name) => {
    document.querySelectorAll('.vx .tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
    document.querySelectorAll('.vx [data-page]').forEach(s => { if (s.dataset.page === name) s.removeAttribute('hidden'); else s.setAttribute('hidden', ''); });
    dash.setLink(name);
  };
  document.querySelectorAll('.vx .tab').forEach(t => t.addEventListener('click', () => show(t.dataset.tab)));
  document.querySelectorAll('.vx [data-go]').forEach(b => b.addEventListener('click', () => show(b.dataset.go)));
  const h = location.hash.slice(1);
  if (h && document.querySelector('.vx [data-page="' + h + '"]')) show(h);
})();
</script>

<script>
(function(){
  const eur = (v) => v == null ? '' : new Intl.NumberFormat('de-DE', {style: 'currency', currency: 'EUR', maximumFractionDigits: v >= 1000 ? 0 : 2}).format(v);
  const int = (v) => v == null ? '' : new Intl.NumberFormat('de-DE').format(v);
  const star = (v) => v == null ? '–' : v.toFixed(1).replace('.', ',');
  window.HCF = {eur, int, star};
  const one = (id) => { const d = dash.data(id); return d.status === 'ok' ? d.data[0] : null; };
  const setNum = (name, f, fmt) => dash.draw(name, (el) => { const r = one('kpi'); el.textContent = r ? fmt(r[f]) : '—'; });
  [['k_listings', 'listings'], ['k_listings2', 'listings'], ['k_models', 'models'], ['k_reviews', 'reviews'], ['k_flags', 'flags'], ['k_err', 'preisfehler'], ['lead_n', 'flags'], ['lead_e', 'preisfehler'], ['k_flagpages', 'flagPages'], ['k_low', 'lowModels']].forEach(([n, f]) => setNum(n, f, int));
  setNum('k_stars', 'stars', star);
  dash.draw('flagbar', (el) => { const r = one('kpi'); el.style.width = r ? Math.max(2, r.flagPages / r.listings * 100) + '%' : '0%'; });
  const whereVal = (el) => decodeURIComponent((el.dataset.where || '').split('=')[1] || '');
  dash.draw('fc', (el) => { const d = dash.data('flagcount'); const r = d.status === 'ok' ? d.data.find(x => x.art === whereVal(el)) : null; el.textContent = r ? int(r.n) : '—'; });
  dash.draw('k_third', (el) => { const d = dash.data('flagcount'); const r = d.status === 'ok' ? d.data.find(x => x.art === 'Drittanbieter') : null; el.textContent = r ? int(r.n) : '—'; });
  const shopRow = (el) => { const d = dash.data('shops'); return d.status === 'ok' ? d.data.find(x => x.shop === whereVal(el)) : null; };
  dash.draw('shopnum', (el) => { const r = shopRow(el); el.textContent = r ? int(r.listings) : '—'; });
  dash.draw('tpnum', (el) => { const d = dash.data('tpstats'); el.textContent = d.status === 'ok' ? int(d.data[0].n) : '—'; });
  dash.draw('tpstar', (el) => { const d = dash.data('tpstats'); el.textContent = d.status === 'ok' ? star(d.data[0].stars) : '—'; });
  dash.draw('shopstar', (el) => { const r = shopRow(el); el.textContent = r ? star(r.stars) : '—'; });
})();
</script>

<script>
(function(){
  const {eur, int, star} = window.HCF;
  const css = (n) => getComputedStyle(document.querySelector('.vx')).getPropertyValue(n).trim();
  const tipOf = (el) => { let t = el.querySelector('.tip'); if (!t) { t = document.createElement('div'); t.className = 'tip'; t.hidden = true; el.appendChild(t); } return t; };
  const tipShow = (el, ev, a, b) => { const t = tipOf(el); t.replaceChildren(); const x1 = document.createElement('div'); x1.textContent = a; const x2 = document.createElement('div'); x2.textContent = b; t.append(x1, x2); const bb = el.getBoundingClientRect(); t.hidden = false; let x = ev.clientX - bb.left + 12; if (x + t.offsetWidth > bb.width) x = Math.max(0, ev.clientX - bb.left - t.offsetWidth - 12); t.style.left = x + 'px'; t.style.top = (ev.clientY - bb.top + 12) + 'px'; };
  const tipHide = (el) => { const t = el.querySelector('.tip'); if (t) t.hidden = true; };
  const textW = (svg, s, size) => { const t = svg.append('text').attr('font-size', size).text(s); const w = t.node().getComputedTextLength(); t.remove(); return w; };

  const flagRows = (tb, filt) => { const d = dash.data('flags'); tb.replaceChildren(); if (d.status !== 'ok') return;

      tr.append(td(r.shop), link(r.produkt, r.url), td(eur(r.preis), 'r'), status(r.art), td(r.detail, 'muted')); tb.append(tr); }); };
  const fv = () => { const s = document.querySelector('.vx .flagfilter'), q = document.querySelector('.vx .flagsearch'); return {art: s ? s.value : '', q: (q ? q.value : '').toLowerCase().split(/\s+/).filter(Boolean)}; };
  document.querySelectorAll('.vx .flagfilter, .vx .flagsearch').forEach(i => i.addEventListener('input', () => dash.draw('t_flags')));
  dash.draw('t_flags', (tb) => { const f = fv(); flagRows(tb, r => (!f.art || r.art === f.art) && f.q.every(w => [r.shop, r.produkt, r.art, r.detail].join(' ').toLowerCase().includes(w))); });
  dash.draw('t_flags_all', (tb) => flagRows(tb, () => true));

  const cmp = (s) => (a, b) => { const va = a[s.k], vb = b[s.k]; if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1; return (typeof va === 'string' ? va.localeCompare(vb) : va - vb) * s.dir; };

<script>
/* Kleiner Ersatz für die Dashboard-Laufzeit von Claude: liefert dash.data, dash.calc, dash.loader,
   dash.draw usw. aus den eingebetteten (entschlüsselten) Daten, damit die Seite unverändert läuft. */
(function(){
  const raw = {}, loaders = {}, calcs = {}, cache = {}, draws = {}, onData = [];
  const order = [];
  const get = (id) => {
    if (id in cache) return cache[id];
    if (calcs[id]) { const c = calcs[id]; cache[id] = c.fn(...c.inputs.map(i => get(i))); return cache[id]; }
    if (id in raw) { cache[id] = loaders[id] ? loaders[id](raw[id]) : raw[id]; return cache[id]; }
    return undefined;
  };
  const visible = (el) => !el.closest('[hidden]');
  const runDraw = (name) => { (draws[name] ? [name] : []).forEach(n => document.querySelectorAll('[data-draw="' + n + '"]').forEach(el => { if (!visible(el)) return; try { draws[n](el); } catch (e) { console.error('draw ' + n, e); } })); };
  const runAll = () => { Object.keys(draws).forEach(runDraw); onData.forEach(f => { try { f(); } catch (e) { console.error(e); } }); };
  window.dash = {
    colors: ['#16181d', '#004177', '#2F6FED', '#1E9E5A', '#A855F7', '#E5484D', '#0EA5A4', '#B7791F'],
    data: (id) => { const d = get(id); return d === undefined ? {status: 'missing', data: [], columns: [], meta: []} : {status: 'ok', data: d, columns: Array.isArray(d) && d[0] ? Object.keys(d[0]) : [], meta: []}; },
    loader: (id, o) => { loaders[id] = (rows) => o.fn(rows); },
    calc: (id, o) => { calcs[id] = o; },
    draw: (name, fn) => { if (fn) { draws[name] = typeof fn === 'function' ? fn : (el) => { const m = el.__made || (el.__made = fn.mount ? fn.mount(el) : null); fn.update && fn.update(el, m); }; if (window.__hcReady) runDraw(name); } else runDraw(name); },
    onData: (fn) => { onData.push(fn); if (window.__hcReady) fn(); },
    refresh: () => location.reload(),
    setLink: (name) => { try { history.replaceState(null, '', '#' + name); } catch (e) {} },
    params: () => ({}), setParams: () => {}, resetParams: () => {},
    __load: (data) => { Object.assign(raw, data); },
    __start: () => {
      window.__hcReady = true; runAll();
      new MutationObserver((ms) => { if (ms.some(m => m.attributeName === 'hidden' && !m.target.hidden)) requestAnimationFrame(runAll); })
        .observe(document.getElementById('dash-root'), {attributes: true, subtree: true, attributeFilter: ['hidden']});
      let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(runAll, 200); });
    }
  };
})();

(function(){
  const ENC = JSON.parse(document.getElementById('enc').textContent);
  const KEY = 'hc_pw';
  const $ = id => document.getElementById(id);
  const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function oeffnen(pw){
    if (!window.crypto || !crypto.subtle) throw new Error('Dieser Browser unterstützt keine Verschlüsselung. Bitte einen aktuellen Browser verwenden.');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: ub(ENC.s), iterations: ENC.n, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: ub(ENC.i)}, key, ub(ENC.c));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function start(D, pw, merken){
    try { merken ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch (e) {}
    $('gate').hidden = true;
    dash.__load({products: D.products, reviews: D.reviews});
    const root = $('dash-root');
    const frag = $('page').content.cloneNode(true);
    const scripts = [...frag.querySelectorAll('script')];
    scripts.forEach(s => s.remove());
    root.append(frag);
    scripts.forEach(s => { const n = document.createElement('script'); n.textContent = s.textContent; document.body.appendChild(n); });
    dash.__start();
    $('stand').textContent = 'Datenstand: ' + (D.stand || '–');
    $('foot').hidden = false;
  }
  $('logout').addEventListener('click', () => { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); });
  $('gform').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('gpw').value.trim(); if (!pw) return;
    $('gbtn').disabled = true; $('gbtn').textContent = 'Wird geöffnet …'; $('gerr').hidden = true;
    try { start(await oeffnen(pw), pw, $('gkeep').checked); }
    catch (err) {
      $('gerr').textContent = err && err.name === 'OperationError' ? 'Das Passwort stimmt nicht. Bitte noch einmal versuchen.' : (err.message || 'Die Seite konnte nicht geöffnet werden.');
      $('gerr').hidden = false; $('gpw').select();
    } finally { $('gbtn').disabled = false; $('gbtn').textContent = 'Öffnen'; }
  });
  let gespeichert = null; try { gespeichert = localStorage.getItem(KEY); } catch (e) {}
  if (gespeichert) oeffnen(gespeichert).then(D => start(D, gespeichert, true)).catch(() => { try { localStorage.removeItem(KEY); } catch (e) {} $('gpw').focus(); });
  else $('gpw').focus();
})();
</script>
